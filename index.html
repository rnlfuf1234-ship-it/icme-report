h1 { margin: 0; text-align: center; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: var(--teal-d); }
h1 em { font-style: normal; color: var(--yellow); }
.sub { margin: -10px 0 0; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.5; }
form { display: flex; flex-direction: column; gap: 10px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
input { font: inherit; font-size: 15px; padding: 12px 16px; border-radius: 999px; border: 1px solid var(--line); background: #f8fbfc; color: var(--fg); outline: none; }
input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgb(92 193 207 / .25); background: #fff; }
button { font: inherit; font-size: 15px; font-weight: 700; margin-top: 6px; padding: 13px 16px; border: 0; border-radius: 999px; background: var(--teal-d); color: #fff; cursor: pointer; }
button:hover { filter: brightness(1.06); }
button:disabled { opacity: .6; cursor: progress; }
button:focus-visible { outline: 3px solid rgb(92 193 207 / .5); outline-offset: 2px; }
.msg { min-height: 20px; margin: 0; text-align: center; font-size: 13px; color: var(--pink); }
.msg.busy { color: var(--muted); }
.foot { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main class="card">
  <div class="logo" role="img" aria-label="아이크미 창의융합 놀이영어 로고"></div>
  <h1>가맹센터 성과 공유 리포트<em>!</em></h1>
  <p class="sub">미스터리 쇼퍼 26개 센터 · 2026년 11월<br>공유받은 아이디와 비밀번호로 들어오세요.</p>
  <form id="login" autocomplete="off">
    <label>아이디 <input id="id" name="id" required autocomplete="username" autocapitalize="off" spellcheck="false"></label>
    <label>비밀번호 <input id="pw" name="pw" type="password" required autocomplete="current-password"></label>
    <button id="go" type="submit">리포트 열기</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="foot">플레이업파트너스 · 아이크미 본사 공유용</p>
</main>
<script>
(() => {
  // report.bin = salt(16) | iv(16) | hmac(32) | AES-256-CBC(gzip(report html)); keys come from PBKDF2-SHA256(id + "\n" + password).
  const ITER = 300000;
  const te = new TextEncoder();
  const msg = document.getElementById('msg');
  const go = document.getElementById('go');
  const say = (t, busy) => { msg.textContent = t; msg.className = 'msg' + (busy ? ' busy' : ''); };
  const b64 = (u8) => btoa(String.fromCharCode(...u8));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let file = null;
  const load = () => file || (file = fetch('report.bin', { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error('load'); return r.arrayBuffer(); }).then((b) => new Uint8Array(b)));
  const open = async (bits) => {
    const buf = await load();
    const salt = buf.slice(0, 16), iv = buf.slice(16, 32), mac = buf.slice(32, 64), body = buf.slice(64);
    if (!bits) return { salt };
    const macKey = await crypto.subtle.importKey('raw', bits.slice(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    const signed = new Uint8Array(iv.length + body.length); signed.set(iv); signed.set(body, iv.length);
    if (!(await crypto.subtle.verify('HMAC', macKey, mac, signed))) return null;
    const aesKey = await crypto.subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
    const zipped = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, aesKey, body);
    return new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  };
  const show = (html) => { document.open(); document.write(html); document.close(); };
  const derive = async (id, pw) => {
    const { salt } = await open(null);
    const base = await crypto.subtle.importKey('raw', te.encode(id.normalize('NFC').trim() + '\n' + pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITER }, base, 512));
  };
  // stay signed in for this browser tab
  try {
    const saved = sessionStorage.getItem('icme-report-key');
    if (saved) { say('리포트를 여는 중입니다…', true); open(unb64(saved)).then((html) => (html ? show(html) : say(''))).catch(() => say('')); }
  } catch (e) { /* storage blocked */ }
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) say('이 브라우저에서는 열 수 없습니다. 크롬·엣지·사파리 최신 버전으로 열어 주세요.');
  document.getElementById('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    go.disabled = true;
    say('리포트를 여는 중입니다… (약 7MB)', true);
    try {
      const bits = await derive(document.getElementById('id').value, document.getElementById('pw').value);
      const html = await open(bits);
      if (!html) { say('아이디 또는 비밀번호가 맞지 않습니다.'); go.disabled = false; return; }
      try { sessionStorage.setItem('icme-report-key', b64(bits)); } catch (err) { /* storage blocked */ }
      show(html);
    } catch (err) {
      say('리포트를 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.');
      go.disabled = false;
    }
  });
})();
</script>
</body>
</html>
